name: Inspeccionar esquema Intervals.icu (solo campos)

on:
  push:
    branches: [feature/adolfo-training]
    paths:
      - "scripts/inspect_intervals.py"
      - ".github/workflows/inspect-intervals.yml"
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Inspeccionar (sin imprimir valores personales)
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python scripts/inspect_intervals.py
