name: Deploy web to GitHub Pages (panel heredado)

# Panel original. Pasa a ser manual para que no sobrescriba la nueva app
# Adolfo Training cuando esta se publique con app-deploy.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generar config.js desde secret
        run: |
          cat <<EOF > web/config.js
          window.SUPABASE_CONFIG = {
            url: "${{ secrets.SUPABASE_URL }}",
            anonKey: "${{ secrets.SUPABASE_ANON_KEY }}",
          };
          EOF

      - name: Forzar actualizacion del service worker en cada deploy
        run: sed -i "s/__CACHE_VERSION__/${{ github.sha }}/" web/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
