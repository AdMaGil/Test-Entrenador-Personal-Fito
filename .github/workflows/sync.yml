name: Sync training + body composition data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Dias hacia atras a sincronizar (por defecto 30; usa un numero mayor para una recarga puntual del historico)"
        required: false
        default: "30"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Forzar DNS publico (Cloudflare/Google)
        run: |
          echo "---- resolv.conf ANTES ----"
          cat /etc/resolv.conf || true
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf
          echo "---- resolv.conf DESPUES ----"
          cat /etc/resolv.conf

      - name: Diagnostico DNS/conectividad Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          host=$(python3 -c "import os,urllib.parse as u; print(u.urlparse(os.environ['SUPABASE_URL']).hostname)")
          echo "::notice::Host extraido de SUPABASE_URL: '$host'"
          echo "::notice::Longitud de SUPABASE_URL (raw): ${#SUPABASE_URL}"
          echo "---- getent hosts (tras forzar DNS publico) ----"
          if getent hosts "$host"; then
            echo "::notice::DNS resuelto correctamente con getent"
          else
            echo "::error::getent NO pudo resolver '$host' incluso con DNS publico"
          fi
          echo "---- curl ----"
          if curl -sS -o /dev/null -w "HTTP_STATUS:%{http_code}\n" --max-time 15 "https://$host/rest/v1/"; then
            echo "::notice::curl pudo conectar a https://$host"
          else
            echo "::error::curl NO pudo conectar a https://$host (exit $?)"
          fi

      - name: Sincronizar intervals.icu (actividades + bienestar + peso) -> Supabase
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
        run: python scripts/sync_intervals.py
