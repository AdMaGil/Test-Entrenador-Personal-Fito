name: Adolfo Training · comprobaciones

on:
  pull_request:
  push:
    branches: [feature/adolfo-training]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc -b
      - name: Pruebas de lógica
        run: npx vitest run
      - name: Build
        run: npx vite build

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Migraciones y RLS sobre PostgreSQL embebido
        run: node run_migrations_test.mjs

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Pruebas de la sincronización
        run: python -m unittest scripts/test_intervals_sync.py
